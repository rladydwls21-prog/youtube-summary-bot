name: YouTube Summary Bot

on:
  schedule:
    # 매시 7분 (UTC). GitHub Actions cron은 정시에 몰리면 지연되므로 비정시 권장.
    - cron: "7 * * * *"
  workflow_dispatch: {}

jobs:
  summarize:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # state.json 자동 commit & push에 필요
    concurrency:
      group: youtube-summary
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run summarizer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python tools/main.py

      - name: Commit state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- state.json; then
            git add state.json
            git commit -m "chore: update state $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          else
            echo "No state change"
          fi
